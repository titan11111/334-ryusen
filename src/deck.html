<section id="control-deck" class="fc-control-deck" aria-label="操船操作盤">
  <div class="fc-deck-left">
    <div id="fc-dpad-wrap" class="fc-dpad-wrap" aria-label="操船方向パッド">
      <div id="fc-dpad" class="fc-dpad" data-up="0" data-down="0" data-left="0" data-right="0">
        <div class="fc-dpad-v"></div><div class="fc-dpad-h"></div><div class="fc-dpad-c"></div>
        <span class="pad-left">◀</span><span class="pad-right">▶</span>
      </div>
    </div>
    <div class="deck-caption">岩・岸の近くで強く突く</div>
  </div>
  <div class="fc-deck-center"><div id="poleState">竿を構える</div><div class="deck-tools" id="deckTools"></div><small>← → 操船 / P 停止</small></div>
  <div class="fc-deck-right"><div class="fc-ab">
    <button type="button" id="fc-btn-b" class="fc-abbtn fc-abbtn-b" aria-label="竿ブレーキ B E X"><b>B</b><span>ブレーキ</span></button>
    <button type="button" id="fc-btn-a" class="fc-abbtn fc-abbtn-a" aria-label="踏ん張る A Space Z"><b>A</b><span>踏ん張る</span></button>
  </div></div>
</section>
