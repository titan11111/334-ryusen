<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>激流ワンポール</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: full-bleed 3D canvas; HUD hugs the corners, controls sit in the thumb zone */
:root{
  --abyss:#061418; --ink:#eaf5f2; --muted:#9fbcb7; --river:#38d6c1;
  --foam:#f6fbfa; --raft:#ff5a1f; --gold:#ffcf5a; --danger:#ff4d4d;
  --panel:rgba(5,20,24,.66); --line:rgba(234,245,242,.18);
  --display:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--abyss);color:var(--ink);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lbl{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:700}
#pax{display:grid;grid-template-columns:repeat(5,14px);gap:4px;margin:4px 0 8px}
.p{width:14px;height:14px;border-radius:50%;background:var(--raft);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.p.water{background:transparent;border:2px solid var(--river);box-sizing:border-box;animation:blink .5s steps(2) infinite}
.p.lost{background:transparent;position:relative}
.p.lost::before,.p.lost::after{content:"";position:absolute;left:6px;top:0;width:2px;height:14px;background:#6b7f7c;transform:rotate(45deg)}
.p.lost::after{transform:rotate(-45deg)}
@keyframes blink{50%{opacity:.25}}
.bar{width:94px;height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--raft));transition:width .2s}
.right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#grade{font-family:var(--display);font-size:22px;line-height:1;letter-spacing:.02em}
#dist{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
#prog{background:var(--river)}
#camBtn{pointer-events:auto;font:700 12px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
#banner{position:absolute;left:0;right:0;top:24%;text-align:center;opacity:0;transition:opacity .4s;padding:0 16px}
#banner.on{opacity:1}
#banner b{display:block;font-family:var(--display);font-size:clamp(26px,7vw,52px);line-height:1.15;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 24px rgba(0,0,0,.5);text-wrap:balance}
#banner span{display:inline-block;margin-top:8px;font-weight:900;font-size:14px;letter-spacing:.2em;background:var(--river);color:var(--abyss);padding:3px 10px;border-radius:3px}
#warn{position:absolute;left:0;right:0;top:44%;text-align:center;font-family:var(--display);font-size:clamp(34px,10vw,72px);color:var(--gold);text-shadow:0 4px 0 #7a1d00,0 0 30px rgba(255,90,31,.6);opacity:0}
#warn.on{animation:pulse .45s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.35;transform:scale(.96)}to{opacity:1;transform:scale(1.06)}}
#toasts{position:absolute;left:50%;top:58%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(90vw,420px)}
.toast{font-weight:900;font-size:16px;padding:6px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--line);animation:toast 1.8s forwards;text-align:center}
.toast.bad{color:#fff;background:rgba(160,20,20,.75)}
.toast.good{color:var(--abyss);background:var(--river)}
.toast.hit{color:var(--abyss);background:var(--gold)}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#ctrl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{pointer-events:auto;touch-action:none;border:2px solid rgba(255,255,255,.35);color:var(--ink);font-family:var(--body);font-weight:900;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),rgba(5,20,24,.72) 70%);border-radius:50%;width:84px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:28px;line-height:1}
.btn small{font-size:11px;letter-spacing:.1em}
.btn.on{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),rgba(56,214,193,.55) 70%);border-color:var(--river);transform:scale(.95)}
#bB{width:118px;height:62px;border-radius:14px;font-size:17px;letter-spacing:.08em;background:linear-gradient(180deg,#ff7a3d,#c63a0c);border-color:#ffd2b8}
#bB.on{background:linear-gradient(180deg,#ffd166,#ff8a3d);color:#3a1200}
#bB.call{animation:callb .35s infinite alternate}
@keyframes callb{to{box-shadow:0 0 0 6px rgba(255,207,90,.55),0 0 26px rgba(255,140,40,.9)}}
.keys{position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
@media (hover:none){.keys{display:none}}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;
  background:linear-gradient(180deg,rgba(4,16,19,.25),rgba(4,16,19,.85) 70%);
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.card{max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px}
.kicker{font-weight:900;letter-spacing:.3em;font-size:12px;color:var(--river)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(46px,14vw,92px);line-height:.95;letter-spacing:-.01em;text-shadow:0 5px 0 rgba(0,0,0,.5);text-wrap:balance}
h1 em{font-style:normal;color:var(--raft)}
.lead{margin:0;font-size:15px;line-height:1.7;max-width:34em;color:#d4e6e2}
.rules{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;line-height:1.5;margin:0;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.rules dt{font-weight:900;color:var(--gold);white-space:nowrap}
.rules dd{margin:0;color:#d4e6e2}
.go{pointer-events:auto;align-self:flex-start;font-family:var(--display);font-size:24px;color:#2a0d00;background:linear-gradient(180deg,#ffd166,#ff6a1f);border:0;border-radius:12px;padding:14px 30px;cursor:pointer;box-shadow:0 6px 0 #8a2b00}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #8a2b00}
.go:focus-visible,.btn:focus-visible,#camBtn:focus-visible{outline:3px solid var(--river);outline-offset:3px}
.rank{font-family:var(--display);font-size:clamp(70px,22vw,140px);line-height:.9;color:var(--gold);text-shadow:0 6px 0 #7a1d00}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.1em}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:.2em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#warn.on,.p.water,#bB.call{animation:none;opacity:1}}
</style>

<div id="game">
  <canvas id="cv"></canvas>
  <div id="loading">川を流しています…</div>
  <div class="hud" id="hud" hidden>
    <div class="top">
      <div class="panel">
        <div class="lbl">乗客</div>
        <div id="pax"></div>
        <div class="lbl">ラフト耐久</div>
        <div class="bar"><i id="hullbar"></i></div>
      </div>
      <div class="right">
        <div class="panel" style="text-align:right">
          <div id="grade">CLASS I</div>
          <div id="dist">ゴールまで ---m</div>
          <div class="bar" style="margin-left:auto"><i id="prog"></i></div>
        </div>
        <button id="camBtn" type="button">視点：後方</button>
      </div>
    </div>
    <div id="banner"><b id="bTitle"></b><span id="bSub"></span></div>
    <div id="warn">ふんばれ！</div>
    <div id="toasts"></div>
    <div class="keys">← → / A D：棒で突く　SPACE：ふんばる　C：視点</div>
    <div id="ctrl">
      <button class="btn" id="bL" type="button" aria-label="棒で突いて左へ">◀<small>左へ</small></button>
      <button class="btn" id="bB" type="button">ふんばる</button>
      <button class="btn" id="bR" type="button" aria-label="棒で突いて右へ">▶<small>右へ</small></button>
    </div>
  </div>

  <div class="screen" id="title" hidden>
    <div class="card">
      <div class="kicker">RIVER RAFTING / 棒一本</div>
      <h1>激流<br><em>ワン</em>ポール</h1>
      <p class="lead">乗客10人。あなたの手には樫の棒が一本だけ。<br>1.5kmの渓谷を下り、全員を生きてゴールの淵へ届けろ。</p>
      <dl class="rules">
        <dt>◀ ▶</dt><dd>棒で川底を突いて左右へ。岩や岸の近くで突くと強く押せる。</dd>
        <dt>ふんばる</dt><dd>長押しで全員しがみつく。落差の前は必ず。棒は使えない。</dd>
        <dt>落水</dt><dd>流された客にラフトを寄せれば救助できる。</dd>
      </dl>
      <button class="go" id="startBtn" type="button">漕ぎ出す</button>
    </div>
  </div>

  <div class="screen" id="result" hidden>
    <div class="card">
      <div class="kicker" id="rKick">GOAL</div>
      <div class="rank" id="rRank">S</div>
      <h1 style="font-size:clamp(28px,8vw,48px)" id="rTitle">伝説の船頭</h1>
      <div class="stats">
        <div><b id="rPax">10/10</b><span>生還</span></div>
        <div><b id="rHull">100%</b><span>ラフト</span></div>
        <div><b id="rTime">0:00</b><span>タイム</span></div>
      </div>
      <p class="lead" id="rNote"></p>
      <button class="go" id="againBtn" type="button">もう一度下る</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
// ================= utilities =================
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hash2(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm2(x,y,s=0,o=4){let r=0,a=.5,f=1;for(let i=0;i<o;i++){r+=a*vnoise(x*f,y*f,s+i*17);f*=2.03;a*=.5;}return r/(1-Math.pow(.5,o));}
const srgb=(r,g,b)=>new THREE.Color(r,g,b).convertSRGBToLinear();

// ================= river definition =================
const L=1500, GOAL_S=1478, S0=-60, S1=L+240, NS=S1-S0+1;
const GK=[[-60,1],[100,1],[135,2.2],[290,2.5],[322,1.3],[370,1.3],[405,3.1],[600,3.3],[700,3.4],[760,3.1],[792,1.6],[860,1.7],[895,4],[1120,4.3],[1175,5],[1385,5],[1425,2],[1462,1],[2000,1]];
function gradeAt(s){for(let i=1;i<GK.length;i++){if(s<=GK[i][0]){const a=GK[i-1],b=GK[i];const t=(s-a[0])/(b[0]-a[0]);const k=t*t*(3-2*t);return a[1]+(b[1]-a[1])*k;}}return 1;}
const DROPS=[{s:640,h:3.4,name:'カッパ落とし',sev:.3,braceSev:.05},{s:1150,h:5.8,name:'鬼の喉笛',sev:.45,braceSev:.1}];
const SECTIONS=[[105,'第一の瀬「ざわめき」','CLASS II'],[395,'第二の瀬「石の迷路」','CLASS III'],[588,'落差「カッパ落とし」','ふんばる準備'],[885,'第三の瀬「竜の背」','CLASS IV'],[1095,'大落差「鬼の喉笛」','死ぬ気でふんばれ'],[1172,'最終瀬「地獄の門」','CLASS V'],[1420,'ゴールの淵が見えた','あと少し']];

const CX=new Float32Array(NS),H=new Float32Array(NS),W=new Float32Array(NS),IN=new Float32Array(NS),DR=new Float32Array(NS),NX=new Float32Array(NS),NZ=new Float32Array(NS),TX=new Float32Array(NS),TZ=new Float32Array(NS);
const cxf=s=>22*Math.sin(s*.0045)+10*Math.sin(s*.013+1.3)+4*Math.sin(s*.031+.4);
for(let i=0;i<NS;i++){const s=S0+i;const I=clamp((gradeAt(s)-1)/4,0,1);IN[i]=I;CX[i]=cxf(s);
  let w=25-8*I+3*Math.sin(s*.013);if(s>1440)w+=Math.min((s-1440)*.35,16);W[i]=w;}
H[0]=60;for(let i=1;i<NS;i++){const s=S0+i;let dh=.012+.05*IN[i];for(const d of DROPS){if(s>d.s&&s<=d.s+3)dh+=d.h/3;}H[i]=H[i-1]-dh;}
for(let i=0;i<NS;i++){const s=S0+i;let v=0;for(const d of DROPS){if(s>=d.s-1&&s<d.s+3)v=Math.max(v,1);else if(s>=d.s+3&&s<d.s+40)v=Math.max(v,Math.exp(-(s-d.s-3)/9));}DR[i]=v;
  const a=CX[Math.max(i-1,0)],b=CX[Math.min(i+1,NS-1)];const dx=b-a,dz=-2,len=Math.hypot(dx,dz);TX[i]=dx/len;TZ[i]=dz/len;NX[i]=-TZ[i];NZ[i]=TX[i];}
function smp(s,arr){let f=s-S0;if(f<0)f=0;if(f>NS-1.001)f=NS-1.001;const i=f|0,t=f-i;return arr[i]+(arr[i+1]-arr[i])*t;}
function wpos(s,u,y,out){const nx=smp(s,NX),nz=smp(s,NZ);return out.set(smp(s,CX)+nx*u,smp(s,H)+y,-s+nz*u);}
function waveY(s,u,t){const I=smp(s,IN),dr=smp(s,DR),w=smp(s,W),Wp=w+8;const a=(u+Wp/2)/Wp;const amp=.04+.5*I*I+dr*.7;
  const e=clamp(1-Math.abs(u)/(w/2),0,1);
  return amp*(Math.sin(s*.9-t*6*(.5+I)+a*9)*.5+Math.sin(s*.37+t*2.3+a*23)*.5+Math.sin(s*1.3-t*9+a*4)*.25)*Math.min(1,e*4);}
const flowAt=s=>4.5+12.5*smp(s,IN)+smp(s,DR)*5;

// ================= renderer & scene =================
const canvas=document.getElementById('cv');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const FOG=new THREE.Color('#a9c4c6').convertSRGBToLinear();
scene.fog=new THREE.Fog(FOG,55,330);
const camera=new THREE.PerspectiveCamera(62,1,.1,1200);
const SUN=new THREE.Vector3(-.45,.62,-.64).normalize();
scene.add(new THREE.HemisphereLight(0xcfe6ff,0x3b3226,.75));
const sun=new THREE.DirectionalLight(0xffe2b8,2.6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:160});sun.shadow.bias=-.0006;sun.shadow.normalBias=.03;
scene.add(sun,sun.target);

// ---- sky ----
const NOISE_GLSL=`
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float r=0.,a=.5;for(int i=0;i<5;i++){r+=a*vn(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return r;}`;
const sky=new THREE.Mesh(new THREE.SphereGeometry(900,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{uSun:{value:SUN},uTime:{value:0}},
  vertexShader:`varying vec3 vD;void main(){vD=normalize(position);vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_Position=p.xyww;}`,
  fragmentShader:NOISE_GLSL+`uniform vec3 uSun;uniform float uTime;varying vec3 vD;
  vec3 lin(vec3 c){return pow(c,vec3(2.2));}
  void main(){vec3 d=normalize(vD);float y=d.y;
    vec3 hor=lin(vec3(.66,.77,.78)),zen=lin(vec3(.22,.45,.70));
    vec3 c=mix(hor,zen,pow(clamp(y,0.,1.),.55));
    float sd=max(dot(d,uSun),0.);c+=vec3(1.,.85,.6)*(pow(sd,900.)*12.+pow(sd,10.)*.35);
    vec2 cp=d.xz/(y+.18)*1.6+vec2(uTime*.006,0.);float cl=fbm(cp);
    c=mix(c,mix(lin(vec3(.95,.93,.9)),lin(vec3(.6,.65,.7)),smoothstep(.5,.9,fbm(cp*2.))),smoothstep(.5,.78,cl)*smoothstep(.0,.22,y)*.8);
    if(y<0.)c=hor;
    gl_FragColor=vec4(c,1.);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }`}));
sky.renderOrder=-1;scene.add(sky);

// ================= water =================
const FT_W=64,FT_H=2048,FT_SMAX=L+220;
const foamF=new Float32Array(FT_W*FT_H);
function foamAt(a,s){return {i:clamp(Math.round(a*(FT_W-1)),0,FT_W-1),j:clamp(Math.round(s/FT_SMAX*(FT_H-1)),0,FT_H-1)};}

// ---- rocks (generated before foam) ----
const rng=mulberry32(20261024);
const rocks=[];
(function genRocks(){
  let s=118;
  while(s<1440){const I=smp(s,IN);s+=(34-21*I)*(.75+rng()*.5);if(I<.12)continue;
    if(DROPS.some(d=>s>d.s-9&&s<d.s+12))continue;
    const w=smp(s,W),half=w/2-1.1,gap=9.6-3*I;const gc=(rng()*2-1)*Math.max(0,half-gap/2-.6);
    let u=-half;while(u<half){const r=.85+rng()*(.7+1.5*I);const uc=u+r;
      if(uc+r<half+.5&&Math.abs(uc-gc)>gap/2+r&&rng()<.32+.58*I)rocks.push({s:s+(rng()-.5)*5,u:uc,r,bank:false});
      u+=r*2+.5+rng()*2.6*(1-I);}

let AC=null,rushGain,rushFilt,hissGain,hissFilt,noiseBuf;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);let b=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;b=(b+.02*w)/1.02;d[i]=w*.5+b*3;}
  const mk=(type,f,q,g)=>{const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const gn=AC.createGain();gn.gain.value=g;src.connect(fl);fl.connect(gn);gn.connect(AC.destination);src.start();return[fl,gn];};
  [rushFilt,rushGain]=mk('lowpass',400,.7,.2);[hissFilt,hissGain]=mk('bandpass',2600,.6,.03);}
function sfx(kind,amt=1){if(!AC)return;const t=AC.currentTime;
  const nz=(dur,type,f,g)=>{const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;const gn=AC.createGain();gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(gn);gn.connect(AC.destination);s.start(t);s.stop(t+dur);};
  const tone=(f0,f1,dur,g,type='sine',dl=0)=>{const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t+dl);o.frequency.exponentialRampToValueAtTime(f1,t+dl+dur);const gn=AC.createGain();gn.gain.setValueAtTime(0,t+dl);gn.gain.linearRampToValueAtTime(g,t+dl+.01);gn.gain.exponentialRampToValueAtTime(.001,t+dl+dur);o.connect(gn);gn.connect(AC.destination);o.start(t+dl);o.stop(t+dl+dur+.05);};
  if(kind==='hit'){tone(90,38,.35,.7*amt);nz(.4,'lowpass',500,.6*amt);}
  if(kind==='splash'){nz(.9*amt+.3,'bandpass',900,.7*amt);tone(70,30,.5,.5*amt);}
  if(kind==='pole'){tone(220,140,.12,.25,'triangle');nz(.15,'bandpass',1500,.12);}
  if(kind==='rescue'){tone(660,660,.15,.18,'triangle');tone(990,990,.25,.18,'triangle',.12);}
  if(kind==='lost'){tone(330,180,.6,.15,'triangle');}
  if(kind==='goal'){[523,659,784,1046].forEach((f,i)=>tone(f,f,.4,.2,'triangle',i*.12));}}

// ================= main update =================

          sfx('hit',Math.min(1,impact/10));burst(r.s-r.r*.6,r.u+nu*r.r*.5,.4,Math.round(10+impact*3),impact*.6,.6);
          const sev=clamp((impact-4)/18,0,.22)*(braced?.25:1);if(sev>0)shakeOut(sev,impact>10?2:1);

}

  const tx=smp(st.s,TX),tz=smp(st.s,TZ);
  raftRoot.rotation.order='YXZ';raftRoot.rotation.y=Math.atan2(-tx,-tz)+st.yaw;
  const tp=Math.atan2(slope,2)+Math.atan2(front-back,4.4)+plPitch,tr=Math.atan2(l-r,2.4)*.8+Math.sin(t*2.3)*.02;
  st.pitch=lerp(st.pitch,tp,1-Math.exp(-8*dt));st.roll=lerp(st.roll,tr,1-Math.exp(-8*dt));
  raftRoot.rotation.x=st.pitch;raftRoot.rotation.z=st.roll;
  // camera
  st.shake=Math.max(0,st.shake-dt*1.8);const sh=st.shake*st.shake;
  const T=tmpB.set(tx,0,tz);
  let cp,cl;
  if(camMode===0||st.mode!=='play'){
    const back=st.mode==='play'?10.5:14,up=st.mode==='play'?5.2:7;
    cp=new THREE.Vector3().copy(raftRoot.position).addScaledVector(T,-back);cp.y=Math.max(cp.y,smp(st.s-back,H))+up;
    cl=new THREE.Vector3().copy(raftRoot.position).addScaledVector(T,9);cl.y=smp(st.s+9,H)+1.0;
    if(st.mode==='title'){const a=t*.12;cp.add(new THREE.Vector3(Math.sin(a)*6,1.5,0));}
  }else{
    raftBody.updateWorldMatrix(true,false);cp=raftBody.localToWorld(new THREE.Vector3(0,2.35,2.1));cl=raftBody.localToWorld(new THREE.Vector3(0,1.4,-10));
  }
  const f=camMode===1&&st.mode==='play'?1-Math.exp(-14*dt):1-Math.exp(-4.5*dt);
  if(!camInit.v){camPos.copy(cp);camLook.copy(cl);camInit.v=true;}
  camPos.lerp(cp,f);camLook.lerp(cl,f);
  camera.position.copy(camPos).add(new THREE.Vector3((Math.random()-.5)*sh,(Math.random()-.5)*sh,(Math.random()-.5)*sh));
  camera.lookAt(camLook);
  sun.position.copy(raftRoot.position).addScaledVector(SUN,70);sun.target.position.copy(raftRoot.position);
  sky.position.copy(camera.position);
}

// ================= flow control =================
function finish(ok,why){if(st.mode!=='play')return;st.mode='end';$('warn').classList.remove('on');
  const home=people.filter(p=>p.state==='in').length;
  const m=Math.floor(st.time/60),s=Math.floor(st.time%60);
  $('rPax').textContent=(ok?home:0)+'/10';$('rHull').textContent=Math.round(st.hull)+'%';$('rTime').textContent=m+':'+String(s).padStart(2,'0');
  if(ok){sfx('goal');const rk=home===10?['S','伝説の船頭','10人全員、無傷の笑顔で上陸。渓谷の語り草になる。']:home>=8?['A','一流の船頭','ほぼ全員を連れ帰った。次は10人だ。']:home>=5?['B','見習い船頭','半分以上が生還。棒の使い方を磨こう。']:['C','ずぶ濡れ船頭','ゴールはした。乗客の目線は冷たい。'];
    $('rKick').textContent='GOAL';$('rRank').textContent=rk[0];$('rTitle').textContent=rk[1];$('rNote').textContent=rk[2];}
  else{$('rKick').textContent='GAME OVER';$('rRank').textContent='✕';$('rTitle').textContent='転覆';$('rNote').textContent=why+' 岩の手前で棒を突き、落差の前はふんばれ。';}
  setTimeout(()=>{$('result').hidden=false;$('hud').hidden=true;},900);}
function start(){initAudio();if(AC&&AC.state==='suspended')AC.resume();reset();st.mode='play';camInit.v=false;$('title').hidden=true;$('result').hidden=true;$('hud').hidden=false;banner('出艇','10人を連れて帰れ');}
$('startBtn').addEventListener('click',start);$('againBtn').addEventListener('click',start);

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?72:60;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

let last=performance.now(),clock=0;
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  if(st.mode==='play'){st.time+=dt;update(dt);}
  else if(st.mode==='title'){st.s+=dt*3;if(st.s>380)st.s=6;}
  updParticles(dt);animatePeople(dt,clock);place(dt,clock);
  waterMat.uniforms.uTime.value=clock;sky.material.uniforms.uTime.value=clock;
  renderer.render(scene,camera);}
$('loading').remove();$('title').hidden=false;
requestAnimationFrame(frame);
})();
</script>
